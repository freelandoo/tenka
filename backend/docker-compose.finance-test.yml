services:
  postgres-finance-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenka_test
      POSTGRES_USER: tenka_test
      POSTGRES_PASSWORD: tenka_test
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenka_test -d tenka_test"]
      interval: 2s
      timeout: 3s
      retries: 15
