<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TENKA" />

    <!-- Verificação de propriedade no Google Search Console. Não remover: tirar
         a tag derruba a verificação, mesmo depois de confirmada. O plugin de
         build repete esta tag em todas as rotas geradas. -->
    <meta
      name="google-site-verification"
      content="Qrrjv-aviD9peB0KzntLbBg1kkLL4cqM4Iheb0z4mrc"
    />

    <!-- Google Analytics 4.
         `send_page_view: false` de proposito: num SPA o page_view automatico
         contaria so a primeira pagina de cada visita, e a opcao de contar
         mudancas de History disparia antes de o titulo da rota ser aplicado,
         registrando cada visualizacao com o titulo da pagina anterior. Quem
         dispara e src/lib/usePageviews.ts, depois do titulo estar certo. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XWSJ1D2BXZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Consent Mode v2. Os padroes precisam ser definidos ANTES do config,
      // senao o gtag ja dispara uma medicao antes de saber a escolha de quem
      // recusou numa visita anterior.
      //
      // analytics_storage nasce 'granted' porque a medicao de audiencia se
      // apoia em legitimo interesse (orientacao da ANPD para medicao limitada
      // a padroes e tendencias). Os de publicidade nascem negados: nao sao
      // usados hoje e, se um dia o Google Ads for vinculado, o padrao ja
      // protege. Quem recusou tem a escolha lida do localStorage aqui.
      var tenkaAnalytics = 'granted';
      try {
        if (localStorage.getItem('tenka.consent.analytics') === 'denied') {
          tenkaAnalytics = 'denied';
        }
      } catch (e) {
        // Janela anonima ou storage bloqueado: segue o padrao.
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: tenkaAnalytics
      });

      gtag('js', new Date());
      gtag('config', 'G-XWSJ1D2BXZ', { send_page_view: false });
    </script>

    <!-- Não havia ícone nenhum: todo carregamento pedia /favicon.ico e tomava 404. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Título e description ficam aqui só como fallback do dev server e de
         qualquer rota não listada. No build, scripts/seo-plugin.ts troca os dois
         pelos da rota (ver src/seo/routes.ts). -->
    <meta
      name="description"
      content="TENKA — grupo de tecnologia e entretenimento: games e realidade virtual, 3D e branding, sites, sistemas e automações."
    />
    <title>TENKA Group — Games em VR, 3D, Branding, Sites e Sistemas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Folha de fontes SÍNCRONA, de propósito.
         Tentei carregá-la com media="print" + onload para destravar os ~829 ms
         de render-blocking que o Lighthouse apontava. Funcionou para o FCP
         (4,2 s -> 3,7 s) e quebrou o CLS: 0 -> 0,141, atribuído pelo Lighthouse
         a "Web font loaded" (Unbounded). Com a folha assíncrona o texto pinta na
         fonte de sistema e reflui quando a web font chega.
         CLS é Core Web Vital; FCP não é. Trocar 0,5 s de FCP por 0,14 de CLS é
         prejuízo, então a folha volta a bloquear.
         Para destravar o FCP sem reintroduzir o shift seria preciso casar as
         métricas da fonte de fallback (size-adjust / ascent-override) por
         família, ou reduzir as 9 famílias carregadas aqui. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Initial background set immediately to avoid a white flash before JS loads. -->
    <style>
      html,
      body {
        min-height: 100%;
        background-color: #08090b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
