<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TENKA" />

    <!-- Verificação de propriedade no Google Search Console. Não remover: tirar
         a tag derruba a verificação, mesmo depois de confirmada. O plugin de
         build repete esta tag em todas as rotas geradas. -->
    <meta
      name="google-site-verification"
      content="Qrrjv-aviD9peB0KzntLbBg1kkLL4cqM4Iheb0z4mrc"
    />

    <!-- Não havia ícone nenhum: todo carregamento pedia /favicon.ico e tomava 404. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Título e description ficam aqui só como fallback do dev server e de
         qualquer rota não listada. No build, scripts/seo-plugin.ts troca os dois
         pelos da rota (ver src/seo/routes.ts). -->
    <meta
      name="description"
      content="TENKA — grupo de tecnologia e entretenimento: games e realidade virtual, 3D e branding, sites, sistemas e automações."
    />
    <title>TENKA Group — Games em VR, 3D, Branding, Sites e Sistemas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Initial background set immediately to avoid a white flash before JS loads. -->
    <style>
      html,
      body {
        min-height: 100%;
        background-color: #08090b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
